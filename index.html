<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Opemiposi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#fbeff2;--ink:#3a1240;--mut:#7a5a80;--acc:#9b4dca;--gold:#d99a2b;--card:#fff;--line:#e9cfe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0b22;--ink:#f8e6ef;--mut:#c4a3cc;--acc:#d49bf0;--gold:#f0b94d;--card:#2a1233;--line:#4a2655}}
:root[data-theme="dark"]{--bg:#1c0b22;--ink:#f8e6ef;--mut:#c4a3cc;--acc:#d49bf0;--gold:#f0b94d;--card:#2a1233;--line:#4a2655}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 20% 15%,color-mix(in srgb,var(--acc) 22%,transparent),transparent),radial-gradient(35% 30% at 85% 80%,color-mix(in srgb,var(--gold) 20%,transparent),transparent);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(3%,-3%) scale(1.06)}}
nav{display:flex;justify-content:center;gap:6px;padding:18px 16px 0}
nav a{color:var(--mut);text-decoration:none;padding:8px 18px;border-radius:99px;font-weight:500;transition:.25s}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
nav a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
main{max-width:1000px;margin:0 auto;padding:0 20px}
.page{display:none;animation:in .6s ease both}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1,h2{font-family:Gloock,Georgia,serif;font-weight:400;line-height:1;margin:0}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;min-height:calc(100vh - 150px);padding:30px 0}
.hi{color:var(--mut);margin:0 0 10px;font-size:1.1rem}
h1{font-size:clamp(4.2rem,15vw,9rem);color:var(--acc);letter-spacing:-.02em}
h1 span{display:inline-block;animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{opacity:0;transform:translateY(70px) rotate(8deg)}}
.full{font-family:Gloock,serif;font-size:clamp(1.3rem,3.6vw,1.9rem);margin:12px 0 18px}
.sweet{max-width:30ch;color:var(--mut);margin:0 0 26px}
.btn{font:600 1rem Figtree,sans-serif;border:0;cursor:pointer;border-radius:99px;padding:14px 26px;background:var(--gold);color:#2a1233;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 22px -8px var(--gold)}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);margin-left:8px}
.stack{position:relative;width:min(100%,360px);aspect-ratio:3/4.2;margin:auto;cursor:pointer;touch-action:manipulation}
.stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:22px;border:8px solid var(--card);box-shadow:0 24px 50px -20px rgba(60,10,70,.55);transition:transform .7s cubic-bezier(.2,.9,.3,1.1),opacity .5s;user-select:none}
.stack img[data-p="0"]{transform:rotate(-2deg);z-index:3}
.stack img[data-p="1"]{transform:rotate(7deg) translate(14%,2%);z-index:2}
.stack img[data-p="2"]{transform:rotate(-9deg) translate(-12%,3%);z-index:1}
.tap{text-align:center;color:var(--mut);font-size:.85rem;margin-top:22px}
.sec{padding:36px 0 10px}
h2{font-size:clamp(2rem,6vw,3.2rem);margin-bottom:8px}
.sub{color:var(--mut);margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:14px}
.grid button{position:relative;padding:0;border:0;background:none;cursor:zoom-in;border-radius:18px;overflow:hidden;aspect-ratio:4/5;transition:transform .35s}
.grid button.wide{grid-column:span 2;aspect-ratio:16/10}
.grid .vid::after{content:"\25B6";position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#2a1233;display:grid;place-items:center;font-size:14px;padding-left:3px}
.grid video,.lb video{width:100%;height:100%;object-fit:cover;display:block}
.lb video{max-width:100%;max-height:88vh;border-radius:16px;object-fit:contain;display:none}
.lb.v video{display:block}.lb.v img{display:none}
.mus{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;font:600 .95rem Figtree,sans-serif;border:0;cursor:pointer;border-radius:99px;padding:12px 18px;background:var(--ink);color:var(--bg);box-shadow:0 10px 26px -8px rgba(40,5,50,.6)}
.mus b{font-size:1.2rem;line-height:1}.mus.p b{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px) rotate(14deg)}}
.grid button:hover{transform:rotate(-1.5deg) scale(1.02)}
.grid img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.cakebox{text-align:center;padding:50px 0 20px}
.cake{width:200px;max-width:70%;overflow:visible}
.flame{transform-origin:50% 100%;animation:fl .5s ease-in-out infinite alternate;transition:opacity .4s,transform .4s}
.flame:nth-of-type(2){animation-delay:.15s}.flame:nth-of-type(3){animation-delay:.3s}
@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
.out .flame{opacity:0;animation:none;transform:scale(0)}
.msg{min-height:3.2em;font-family:Gloock,serif;font-size:1.5rem;color:var(--acc);margin:10px 0 18px}
.wishes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:30px 0}
.w{perspective:800px;height:130px;border:0;background:none;padding:0;cursor:pointer}
.w i{position:absolute;inset:0;display:grid;place-items:center;padding:16px;border-radius:18px;font-style:normal;text-align:center;backface-visibility:hidden;transition:transform .6s}
.w{position:relative}
.w i:first-child{background:var(--ink);color:var(--bg);font-family:Gloock,serif;font-size:1.3rem}
.w i:last-child{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);transform:rotateY(180deg)}
.w.f i:first-child{transform:rotateY(180deg)}.w.f i:last-child{transform:none}
footer{text-align:center;color:var(--mut);padding:50px 0 40px;font-size:.95rem}
.lb{position:fixed;inset:0;background:rgba(20,5,26,.88);display:none;place-items:center;z-index:20;padding:20px;cursor:zoom-out}
.lb.on{display:grid;animation:in .3s}.lb img{max-width:100%;max-height:88vh;border-radius:16px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:30}
@media(max-width:480px){body{font-size:16px}.grid{gap:10px;grid-template-columns:1fr 1fr}.grid button.wide{grid-column:span 2}.mus span{display:none}.mus{padding:14px}.stack{width:min(78%,300px)}.btn{padding:13px 22px}}
@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center;min-height:0;gap:50px}.sweet{margin-inline:auto}.btn.ghost{margin:10px 0 0}}
@media(prefers-reduced-motion:reduce){*,body::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav aria-label="Pages"><a href="#home" id="n-home">Home</a><a href="#moments" id="n-moments">Moments</a></nav>
<main>
<section class="page on" id="home">
 <div class="hero">
  <div>
   <p class="hi">Happy birthday,</p>
   <h1 id="nick" aria-label="Pepoo"></h1>
   <p class="full">Opemiposi</p>
   <p class="sweet">Wishing you a year as bright as your smile.</p>
   <button class="btn" id="wish">Make a wish</button><a class="btn ghost" href="#moments" style="text-decoration:none;display:inline-block">See moments</a>
  </div>
  <div>
   <div class="stack" id="stack" title="Tap to shuffle"><img data-img="c" data-p="0" alt="Opemiposi"><img data-img="b" data-p="1" alt="Opemiposi in braids"><img data-img="d" data-p="2" alt="Opemiposi smiling"></div>
   <p class="tap">Tap the photos to shuffle</p>
  </div>
 </div>
</section>

<section class="page" id="moments">
 <div class="sec">
  <h2>A few moments</h2>
  <p class="sub">Tap any photo to see it bigger.</p>
  <div class="grid" id="grid">
   <button><img data-img="f" alt="Opemiposi"></button><button class="vid wide" data-v="1"><video muted loop playsinline preload="metadata" id="gv" aria-label="Short clip"></video></button><button><img data-img="e" alt="Opemiposi"></button><button><img data-img="c" alt="Opemiposi"></button><button class="wide"><img data-img="a" alt="Opemiposi"></button><button><img data-img="d" alt="Opemiposi"></button><button><img data-img="b" alt="Opemiposi"></button>
  </div>
 </div>
 <div class="cakebox" id="cakebox">
  <svg class="cake" viewBox="0 0 200 170" aria-hidden="true">
   <g fill="#f0b94d"><g class="flame"><path d="M60 38c-8-10 0-16 0-26 10 8 10 18 0 26z"/></g><g class="flame"><path d="M100 38c-8-10 0-16 0-26 10 8 10 18 0 26z"/></g><g class="flame"><path d="M140 38c-8-10 0-16 0-26 10 8 10 18 0 26z"/></g></g>
   <g fill="#d49bf0"><rect x="57" y="40" width="6" height="30" rx="2"/><rect x="97" y="40" width="6" height="30" rx="2"/><rect x="137" y="40" width="6" height="30" rx="2"/></g>
   <rect x="25" y="70" width="150" height="46" rx="12" fill="#9b4dca"/><path d="M25 88c15 14 25-6 40 6s25-8 40 4 25-10 40 2 20-6 30-4V82c0-6-4-12-12-12H37c-8 0-12 6-12 12z" fill="#fbeff2"/>
   <rect x="10" y="114" width="180" height="40" rx="12" fill="#6e2f94"/>
  </svg>
  <div class="msg" id="msg">Make a wish, then blow out the candles.</div>
  <button class="btn" id="blow">Blow out candles</button>
 </div>
 <div class="wishes">
  <button class="w"><i>Joy</i><i>May every day this year bring a reason to smile.</i></button>
  <button class="w"><i>Peace</i><i>Wishing you calm days and a light heart.</i></button>
  <button class="w"><i>Wins</i><i>May your goals find you and your hard work pay off.</i></button>
 </div>
</section>
</main>
<footer>Created by Adam</footer>

document.querySelectorAll('[data-img]').forEach(e=>e.src=IMG[e.dataset.img]);
$g=document.getElementById('gv');$g.src=VID;$g.poster=IMG.vp;
const $=s=>document.querySelector(s);
// two pages via hash
function route(){const p=location.hash==='#moments'?'moments':'home';
 document.querySelectorAll('.page').forEach(s=>s.classList.toggle('on',s.id===p));
 ['home','moments'].forEach(n=>{const a=$('#n-'+n);n===p?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
 window.scrollTo(0,0);if(p==='moments')setTimeout(()=>burst(innerWidth/2,innerHeight/3,40),300)}
addEventListener('hashchange',route);route();
// name letters
$('#nick').innerHTML=[...'Pepoo'].map((c,i)=>`<span style="animation-delay:${.15+i*.12}s">${c}</span>`).join('');
// confetti
const cv=$('#cv'),cx=cv.getContext('2d');let P=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(x,y,n=90){const C=['#9b4dca','#f0b94d','#f7a8c8','#d49bf0','#ffffff'];
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*6.3,w:5+Math.random()*6,c:C[i%5],l:1})}
 if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
 P=P.filter(p=>p.l>0&&p.y<cv.height+20);
 P.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.l-=.006;cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);cx.restore()});
 P.length?requestAnimationFrame(tick):(run=false,cx.clearRect(0,0,cv.width,cv.height))}
// hero
setTimeout(()=>burst(innerWidth/2,innerHeight/2.5,110),900);
$('#wish').onclick=e=>{song();const r=e.target.getBoundingClientRect();burst(r.left+r.width/2,r.top,120)};
$('#stack').onclick=()=>{document.querySelectorAll('#stack img').forEach(i=>i.dataset.p=(+i.dataset.p+2)%3)};
// lightbox
const lb=$('#lb'),lv=$('#lbv');
function closeLb(){lb.classList.remove('on','v');lv.pause()}
document.querySelectorAll('#grid button').forEach(b=>b.onclick=()=>{
 if(b.dataset.v){lv.src=VID;lb.classList.add('v','on');lv.play().catch(()=>{})}else{$('#lbi').src=b.firstChild.src;lb.classList.add('on')}});
lb.onclick=e=>{if(e.target!==lv)closeLb()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
// gallery clip autoplay when visible
new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting?$g.play().catch(()=>{}):$g.pause())).observe($g);
// birthday song (synthesized, no file needed)
const N=[[60,.75],[60,.25],[62,1],[60,1],[65,1],[64,2],[60,.75],[60,.25],[62,1],[60,1],[67,1],[65,2],[60,.75],[60,.25],[72,1],[69,1],[65,1],[64,1],[62,2],[70,.75],[70,.25],[69,1],[65,1],[67,1],[65,2.5]];
let AC,playing=false,timer;
function note(m,t,d){const f=440*2**((m-69)/12);[[1,.5],[2,.18],[3,.07]].forEach(([k,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*k;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.5,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d*.5+.5);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d*.5+.6)})}
function setMus(on){playing=on;$('#mus').classList.toggle('p',on);$('#mus span').textContent=on?'Pause song':'Play birthday song';$('#mus').setAttribute('aria-label',on?'Pause birthday song':'Play birthday song')}
function song(){if(playing)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();let t=AC.currentTime+.1;N.forEach(([m,d])=>{note(m,t,d);t+=d*.5});
 setMus(true);timer=setTimeout(()=>{setMus(false);burst(innerWidth/2,innerHeight/2.5,120)},(t-AC.currentTime)*1000+400)}
function stopSong(){clearTimeout(timer);if(AC){AC.close();AC=null}setMus(false)}
$('#mus').onclick=()=>playing?stopSong():song();
// candles
$('#blow').onclick=e=>{const out=$('#cakebox').classList.toggle('out');
 $('#msg').textContent=out?'Your wish is on its way. Happy birthday, Pepoo!':'Make a wish, then blow out the candles.';
 e.target.textContent=out?'Light them again':'Blow out candles';
 if(out){const r=$('.cake').getBoundingClientRect();burst(r.left+r.width/2,r.top,140)}};
// flip cards
document.querySelectorAll('.w').forEach(w=>w.onclick=()=>w.classList.toggle('f'));
</script>
</body>
